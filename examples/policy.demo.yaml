# Demo/dev policy so `make demo` can show a legal INSERT as ALLOW.
# Production screenshots use examples/policy.yaml / ./policy.yaml.
environment: demo
rules:
  select: allow
  insert: allow
  update: allow
  delete: allow
  ddl: block
limits:
  update_rows: 10000
  delete_rows: 10000
# SQLGuard: GameStream-style table allowlist (demo allows orders fully)
permissions:
  enforce: true
  tables:
    orders: [select, insert, update, delete]
hallucination:
  allow_unknown_tables: false
  allow_unknown_columns: false
