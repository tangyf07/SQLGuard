name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: writegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate -d writegate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gate
          MYSQL_DATABASE: writegate
          MYSQL_USER: gate
          MYSQL_PASSWORD: gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgate --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_URL: postgresql://gate:gate@localhost:5432/writegate
      MYSQL_URL: mysql://gate:gate@127.0.0.1:3306/writegate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert version matches tag
        run: python scripts/check_version_tag.py

      - name: Install + test
        run: |
          python -m pip install -U pip
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,postgres,mysql]"
          .venv/bin/pip install build
          pip install build
          make test

      - name: Build wheel and sdist
        run: python -m build

      - name: Install wheel smoke
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -U pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import write_gate; assert write_gate.__version__"
          unset POSTGRES_URL MYSQL_URL DATABASE_URL || true
          SMOKE_DIR=$(mktemp -d)
          ( cd "$SMOKE_DIR" && /tmp/wheel-venv/bin/sql-write-gate init --force \
            && /tmp/wheel-venv/bin/sql-write-gate check "DELETE FROM orders" || test $? -eq 2 )

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert version matches tag
        run: python scripts/check_version_tag.py

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
